<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LexiPic 🇫🇷</title>


<style>

body{

font-family:Arial,sans-serif;
background:#f8fafc;
margin:0;
padding:20px;

}


.container{

max-width:600px;
margin:auto;

}


h1{

text-align:center;
color:#1d4ed8;

}



.menu{

display:flex;
gap:10px;
margin-bottom:20px;

}


.menu button{

flex:1;
padding:14px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
font-size:16px;

}



.section{

display:none;

}



.active{

display:block;

}



.box{

background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

}



input{

width:100%;
padding:13px;
margin-bottom:12px;
border-radius:12px;
border:1px solid #ddd;
box-sizing:border-box;
font-size:16px;

}



.add{

background:#16a34a;
color:white;
border:none;
padding:13px;
width:100%;
border-radius:12px;
font-size:16px;

}



.card{

background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

}



.image{

height:200px;
border-radius:15px;
overflow:hidden;
background:#e2e8f0;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;

}



.image img{

width:100%;
height:100%;
object-fit:cover;

}



.word{

font-size:32px;
font-weight:bold;
margin-top:15px;

}



.meaning{

font-size:20px;
color:#64748b;
margin:10px 0;

}



.voice{

background:#16a34a;
color:white;
border:none;
padding:12px;
border-radius:12px;

}



.delete{

background:#ef4444;
color:white;
border:none;
padding:12px;
border-radius:12px;
margin-left:10px;

}


</style>

</head>


<body>


<div class="container">


<h1>🇫🇷 LexiPic</h1>


<div class="menu">

<button onclick="showAdd()">
📥 단어 추가
</button>


<button onclick="showStudy()">
📚 암기하기
</button>


</div>



<div id="addSection" class="section active">


<div class="box">


<input id="word" placeholder="프랑스어 단어">

<input id="meaning" placeholder="한국어 뜻">


<button class="add" onclick="addWord()">

저장하기

</button>


</div>


</div>



<div id="studySection" class="section">


<div id="list"></div>


</div>


<script>


let words =
JSON.parse(localStorage.getItem("words")) || [];



function save(){

localStorage.setItem(
"words",
JSON.stringify(words)
);

}



function showAdd(){

document
.getElementById("addSection")
.classList.add("active");


document
.getElementById("studySection")
.classList.remove("active");

}



function showStudy(){

document
.getElementById("studySection")
.classList.add("active");


document
.getElementById("addSection")
.classList.remove("active");


render();

}


// 자동 이미지 생성

function getImage(word){


let keyword = encodeURIComponent(word);



return `https://source.unsplash.com/600x400/?${keyword}`;


}





// 프랑스어 AI 발음

function speak(word){


let speech =
new SpeechSynthesisUtterance(word);



speech.lang="fr-FR";

speech.rate=0.8;

speech.pitch=1;



speechSynthesis.cancel();


speechSynthesis.speak(speech);


}




function addWord(){


let word =
document.getElementById("word").value.trim();



let meaning =
document.getElementById("meaning").value.trim();



if(word==="") return;



words.push({

word:word,

meaning:meaning || "뜻 없음"

});



save();



document.getElementById("word").value="";

document.getElementById("meaning").value="";


alert("단어가 저장되었습니다 🇫🇷");


}





function removeWord(index){


words.splice(index,1);


save();


render();


}




function render(){


let list =
document.getElementById("list");


list.innerHTML="";



words.forEach((item,index)=>{



let image =
getImage(item.word);



list.innerHTML += `



<div class="card">


<div class="image">

<img src="${image}" 
onerror="this.parentElement.innerHTML='🖼️';">

</div>



<div class="word">

🇫🇷 ${item.word}

</div>



<div class="meaning">

${item.meaning}

</div>



<button class="voice"
onclick="speak('${item.word}')">

🔊 발음

</button>



<button class="delete"
onclick="removeWord(${index})">

삭제

</button>



</div>


`;



});


}



// 저장된 단어 불러오기

render();



</script>


</body>

</html>
