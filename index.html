<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LexiPic 🇫🇷</title>


<style>

body{

font-family:Arial,sans-serif;
background:#f8fafc;
padding:20px;

}


.container{

max-width:550px;
margin:auto;

}


h1{

text-align:center;
color:#1d4ed8;

}


.box{

background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
margin-bottom:20px;

}



input{

width:100%;
padding:12px;
margin-bottom:10px;
border-radius:12px;
border:1px solid #ddd;
box-sizing:border-box;
font-size:16px;

}



button{

background:#2563eb;
color:white;
border:none;
padding:12px 16px;
border-radius:12px;
cursor:pointer;

}



.card{

background:white;
padding:20px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

}



.photo{

width:100%;
height:180px;
border-radius:15px;
background:#e2e8f0;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
overflow:hidden;
margin-bottom:15px;

}



.photo img{

width:100%;
height:100%;
object-fit:cover;

}



.word{

font-size:30px;
font-weight:bold;

}



.meaning{

font-size:18px;
color:#64748b;
margin:10px 0;

}



.voice{

background:#16a34a;
margin-right:5px;

}



.native{

background:#9333ea;

}



.delete{

background:#ef4444;
margin-left:5px;

}


</style>


</head>


<body>


<div class="container">


<h1>🇫🇷 LexiPic</h1>


<div class="box">


<input id="word" placeholder="프랑스어 단어">

<input id="meaning" placeholder="한국어 뜻">


<input id="image" placeholder="이미지 주소 (선택)">



<button onclick="addWord()">

추가

</button>


</div>


<div id="list"></div>


</div>



<script>


let words =
JSON.parse(localStorage.getItem("words")) || [];



function save(){

localStorage.setItem(
"words",
JSON.stringify(words)
);

}


// 🇫🇷 프랑스어 AI 발음

function speakAI(word){


let speech =
new SpeechSynthesisUtterance(word);



speech.lang="fr-FR";



// 조금 천천히 (학습용)

speech.rate=0.8;

speech.pitch=1;



speechSynthesis.cancel();

speechSynthesis.speak(speech);


}





// 원어민 발음 버튼 (추후 Forvo 연결)

function speakNative(){


alert(
"🗣 원어민 발음 기능은 다음 업데이트에서 연결됩니다!"
);


}





function addWord(){


let word =
document.getElementById("word").value.trim();



let meaning =
document.getElementById("meaning").value.trim();



let image =
document.getElementById("image").value.trim();




if(word==="") return;




words.push({

word:word,

meaning:meaning || "뜻 없음",

image:image || ""

});



save();



document.getElementById("word").value="";

document.getElementById("meaning").value="";

document.getElementById("image").value="";



render();


}




function removeWord(index){


words.splice(index,1);



save();



render();


}





function render(){


let list =
document.getElementById("list");



list.innerHTML="";



words.forEach((item,index)=>{


let imageHTML="🖼️";



if(item.image){

imageHTML=
`
<img src="${item.image}">
`;

}



list.innerHTML += `


<div class="card">


<div class="photo">

${imageHTML}

</div>



<div class="word">

🇫🇷 ${item.word}

</div>



<div class="meaning">

${item.meaning}

</div>


<button class="voice"
onclick="speakAI('${item.word}')">

🔊 AI 발음

</button>



<button class="native"
onclick="speakNative()">

🗣 원어민

</button>



<button class="delete"
onclick="removeWord(${index})">

삭제

</button>



</div>


`;


});


}


// 저장된 단어 표시

render();



</script>


</body>

</html>
