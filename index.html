<script>


let words =
JSON.parse(localStorage.getItem("words")) || [];



function save(){

localStorage.setItem(
"words",
JSON.stringify(words)
);

}




// 언어 감지

function detectLanguage(word){


let french=[

"bonjour",
"merci",
"salut",
"amour",
"france",
"français",
"oui",
"non",
"chat",
"chien",
"fromage",
"maison",
"école"

];


let w=word.toLowerCase();



if(french.includes(w)){

return "fr-FR";

}



if(
w.includes("é") ||
w.includes("è") ||
w.includes("ê") ||
w.includes("ç")
){

return "fr-FR";

}


return "en-US";


}




// 업그레이드 발음

function speak(word){


let lang =
detectLanguage(word);



let voices =
speechSynthesis.getVoices();



let voice =
voices.find(v =>
v.lang.includes(lang)
);



let speech =
new SpeechSynthesisUtterance(word);



speech.lang=lang;



if(voice){

speech.voice=voice;

}



speech.rate=0.85;

speech.pitch=1;



speechSynthesis.cancel();


speechSynthesis.speak(speech);


}
