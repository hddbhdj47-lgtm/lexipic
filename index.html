<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LexiPic 2.0 🇫🇷</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f8fafc;
margin:0;
padding:15px;
}

.container{
max-width:600px;
margin:auto;
}

h1{
text-align:center;
color:#2563eb;
}


.menu{
display:flex;
gap:10px;
margin-bottom:20px;
}

.menu button{
flex:1;
padding:14px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
}


.section{
display:none;
}

.active{
display:block;
}


.card{

background:white;
padding:20px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

}


input{

width:100%;
padding:13px;
margin-bottom:10px;
border-radius:12px;
border:1px solid #ddd;
box-sizing:border-box;

}


button{

cursor:pointer;

}


.save{

width:100%;
background:#16a34a;
color:white;
border:none;
padding:13px;
border-radius:12px;

}



.word{

font-size:30px;
font-weight:bold;

}


.gender{

margin-top:10px;
font-weight:bold;

}


.meaning{

font-size:18px;
color:#64748b;

}


.example{

margin-top:15px;
background:#f1f5f9;
padding:15px;
border-radius:12px;

}



.voice{

background:#16a34a;
color:white;
border:none;
padding:10px;
border-radius:10px;

}


</style>


</head>


<body>


<div class="container">


<h1>🇫🇷 LexiPic</h1>


<div class="menu">

<button onclick="showAdd()">
📥 추가
</button>


<button onclick="showStudy()">
📚 암기
</button>

</div>


<div id="add" class="section active">


<div class="card">


<input id="word" placeholder="프랑스어 입력">


<input id="meaning" placeholder="뜻 (자동 입력 가능)">


<button class="save" onclick="addWord()">

저장

</button>


</div>


</div>


<div id="study" class="section">


<div id="list"></div>


</div>


<script>
// 저장 데이터

let words =
JSON.parse(localStorage.getItem("lexipic")) || [];



function save(){

localStorage.setItem(
"lexipic",
JSON.stringify(words)
);

}



// 프랑스어 자동 정보 데이터

const dictionary = {


"chat":{

meaning:"고양이",
gender:"♂ 남성명사",
example:"J'aime mon chat."

},


"chien":{

meaning:"강아지",
gender:"♂ 남성명사",
example:"Mon chien est gentil."

},


"maison":{

meaning:"집",
gender:"♀ 여성명사",
example:"Ma maison est grande."

},


"voiture":{

meaning:"자동차",
gender:"♀ 여성명사",
example:"J'ai une voiture."

},


"livre":{

meaning:"책",
gender:"♂ 남성명사",
example:"Je lis un livre."

},


"fleur":{

meaning:"꽃",
gender:"♀ 여성명사",
example:"Cette fleur est belle."

},


"soleil":{

meaning:"태양",
gender:"♂ 남성명사",
example:"Le soleil brille."

},


"pain":{

meaning:"빵",
gender:"♂ 남성명사",
example:"Je mange du pain."

}


};





function getInfo(word){


let key =
word.toLowerCase();



return dictionary[key] || {


meaning:"뜻 입력 필요",

gender:"성별 확인 필요",

example:"예문 준비 필요"


};


}





// 화면 변경

function showAdd(){


document
.getElementById("add")
.classList.add("active");


document
.getElementById("study")
.classList.remove("active");


}





function showStudy(){


document
.getElementById("study")
.classList.add("active");


document
.getElementById("add")
.classList.remove("active");


render();


}





// 단어 추가

function addWord(){


let word =
document.getElementById("word").value.trim();



let customMeaning =
document.getElementById("meaning").value.trim();



if(word==="") return;



let info =
getInfo(word);



words.push({

word:word,

meaning:
customMeaning || info.meaning,

gender:
info.gender,

example:
info.example

});



save();



document.getElementById("word").value="";

document.getElementById("meaning").value="";



alert("저장 완료 🇫🇷");



}




// 프랑스어 발음

function speak(text){


let speech =
new SpeechSynthesisUtterance(text);


speech.lang="fr-FR";

speech.rate=0.8;


speechSynthesis.cancel();


speechSynthesis.speak(speech);


}





// 화면 출력

function render(){


let list =
document.getElementById("list");


list.innerHTML="";



words.forEach((item,index)=>{


list.innerHTML += `


<div class="card">


<div class="word">

🇫🇷 ${item.word}

</div>



<div class="gender">

${item.gender}

</div>



<div class="meaning">

뜻 : ${item.meaning}

</div>



<div class="example">

📌 예문

<br>

${item.example}


<br><br>


<button class="voice"
onclick="speak('${item.example}')">

🔊 예문 듣기

</button>


</div>


<button class="voice"
onclick="speak('${item.word}')">

🔊 단어 발음

</button>



</div>


`;



});


}

// 저장된 단어 자동 표시

render();


</script>


</body>

</html>
