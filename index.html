<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LexiPic</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#f1f5f9;
    padding:20px;
}

.container {
    max-width:500px;
    margin:auto;
}

h1 {
    text-align:center;
    color:#2563eb;
}

.box {
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    margin-bottom:20px;
}


input {
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:12px;
    border:1px solid #ddd;
    box-sizing:border-box;
}


button {
    background:#2563eb;
    color:white;
    border:none;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
}


.card {

    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);

}


.image {

    height:150px;
    background:#e2e8f0;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    margin-bottom:15px;

}


.word {

font-size:28px;
font-weight:bold;

}


.meaning {

color:#64748b;
margin:10px 0;

}


.delete {

background:#ef4444;
margin-left:10px;

}

</style>

</head>


<body>


<div class="container">

<h1>📚 LexiPic</h1>


<div class="box">


<input id="word" placeholder="단어">

<input id="meaning" placeholder="뜻">


<button onclick="addWord()">

추가

</button>


</div>



<div id="list"></div>


</div>


<script>


let words = JSON.parse(localStorage.getItem("words")) || [];



function save(){

localStorage.setItem("words",JSON.stringify(words));

}



function speak(word){

let u = new SpeechSynthesisUtterance(word);

u.lang="en-US";

speechSynthesis.speak(u);

}




function addWord(){


let word=document.getElementById("word").value;

let meaning=document.getElementById("meaning").value;


if(word==="") return;



words.push({

word,
meaning

});


save();


document.getElementById("word").value="";

document.getElementById("meaning").value="";


render();


}



function removeWord(i){

words.splice(i,1);

save();

render();

}



function render(){


let list=document.getElementById("list");

list.innerHTML="";


words.forEach((item,i)=>{


list.innerHTML += `


<div class="card">


<div class="image">

🖼️

</div>


<div class="word">

${item.word}

</div>


<div class="meaning">

${item.meaning}

</div>


<button onclick="speak('${item.word}')">

🔊 발음

</button>


<button class="delete" onclick="removeWord(${i})">

삭제

</button>


</div>


`;


});


}


render();


</script>


</body>

</html>
