<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LexiPic 2.5 🇫🇷</title>


<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>


body{

font-family:Arial,sans-serif;

background:#f8fafc;

margin:0;

padding:15px;

}


.container{

max-width:600px;

margin:auto;

}


h1{

text-align:center;

color:#2563eb;

}



.menu{

display:flex;

gap:8px;

margin-bottom:20px;

}


.menu button{

flex:1;

padding:13px;

border:none;

border-radius:15px;

background:#2563eb;

color:white;

font-size:15px;

}



.section{

display:none;

}


.active{

display:block;

}


.card{

background:white;

padding:20px;

border-radius:20px;

margin-bottom:15px;

box-shadow:0 5px 15px rgba(0,0,0,0.08);

}


input{

width:100%;

padding:13px;

box-sizing:border-box;

margin-bottom:10px;

border-radius:12px;

border:1px solid #ddd;

font-size:16px;

}



button{

cursor:pointer;

}



.save{

width:100%;

padding:13px;

background:#16a34a;

color:white;

border:none;

border-radius:12px;

}



.word{

font-size:28px;

font-weight:bold;

}


.meaning{

color:#64748b;

margin-top:10px;

}


.voice{

background:#16a34a;

color:white;

border:none;

padding:10px;

border-radius:10px;

}


</style>


</head>


<body>


<div class="container">


<h1>🇫🇷 LexiPic</h1>


<div class="menu">


<button onclick="showAdd()">

📥 추가

</button>


<button onclick="showStudy()">

📚 암기

</button>


<button onclick="showOCR()">

📷 사진

</button>


</div>


<div id="addSection" class="section active">


<div class="card">


<input id="word" placeholder="프랑스어 단어">


<input id="meaning" placeholder="뜻">


<button class="save" onclick="addWord()">

저장

</button>


</div>


</div>


<div id="studySection" class="section">


<div id="list"></div>


</div>
<div id="ocrSection" class="section">


<div class="card">


<h2>📷 단어장 사진 인식</h2>


<input 
type="file"
accept="image/*"
onchange="readImage(event)"
>


<img id="preview"

style="
width:100%;
border-radius:15px;
margin-top:15px;
display:none;
">


<h3>🔍 인식 결과</h3>


<div id="ocrResult">

사진을 넣어주세요.

</div>



<button class="save"

onclick="saveOCRWords()">

단어장에 추가

</button>



</div>


</div>


<script>


let words =

JSON.parse(localStorage.getItem("lexipicWords"))

|| [];



let ocrWords=[];




function save(){


localStorage.setItem(

"lexipicWords",

JSON.stringify(words)

);


}




// 단어 추가

function addWord(){


let word=

document.getElementById("word").value.trim();


let meaning=

document.getElementById("meaning").value.trim();



if(!word)return;



words.push({

word:word,

meaning:meaning || "뜻 확인 필요"

});



save();


document.getElementById("word").value="";

document.getElementById("meaning").value="";


alert("저장 완료 🇫🇷");


render();


}






function showAdd(){


hideAll();


document

.getElementById("addSection")

.classList.add("active");


}





function showStudy(){


hideAll();


document

.getElementById("studySection")

.classList.add("active");


render();


}





function showOCR(){


hideAll();


document

.getElementById("ocrSection")

.classList.add("active");


}





function hideAll(){


document

.querySelectorAll(".section")

.forEach(section=>{


section.classList.remove("active");


});


}





// 사진 OCR

async function readImage(event){


let file =

event.target.files[0];



if(!file)return;



let preview=

document.getElementById("preview");



preview.src=

URL.createObjectURL(file);



preview.style.display="block";



document.getElementById("ocrResult").innerHTML=

"🔍 프랑스어 분석 중...";




let result = await Tesseract.recognize(

file,

"fra",

{

logger:function(m){

console.log(m);

}

}

);




let text=

result.data.text;



ocrWords =

text

.split(/\s+/)

.map(word=>word.replace(/[^a-zA-ZÀ-ÿ-]/g,""))

.filter(word=>word.length>1);



document.getElementById("ocrResult").innerHTML =


ocrWords.join("<br>");



}





function saveOCRWords(){


ocrWords.forEach(word=>{


words.push({

word:word,

meaning:"뜻 확인 필요"

});


});



save();



alert(

ocrWords.length+

"개 단어 추가 완료 🇫🇷"

);



render();



}




function speak(word){


let speech=

new SpeechSynthesisUtterance(word);



speech.lang="fr-FR";

speech.rate=0.8;


speechSynthesis.cancel();


speechSynthesis.speak(speech);


}




function render(){


let list=

document.getElementById("list");



list.innerHTML="";



words.forEach(item=>{


list.innerHTML +=`


<div class="card">


<div class="word">

🇫🇷 ${item.word}

</div>


<div class="meaning">

뜻 : ${item.meaning}

</div>



<button class="voice"

onclick="speak('${item.word}')">

🔊 듣기

</button>



</div>


`;


});


}

// 처음 실행 시 저장된 단어 표시

render();


</script>


</body>


</html>
